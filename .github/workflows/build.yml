name: Compile Antivirus to EXE

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller watchdog

    - name: Compile Application
      run: pyinstaller --onefile --noconsole --collect-all tkinter --hidden-import=watchdog.observers.winapi --hidden-import=watchdog.observers.read_directory_changes scanner.py

    - name: Save Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Antivirus-Program
        path: dist/
