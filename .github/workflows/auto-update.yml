name: Auto Update Virus Definitions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests

    - name: Execute update script
      run: |
        SCRIPT_PATH=$(find . -name "fetch_hashes.py" -print -quit)
        if [ -z "$SCRIPT_PATH" ]; then
          echo "ERROR: fetch_hashes.py not found!"
          exit 1
        fi
        python "$SCRIPT_PATH"

    - name: Commit and Push updates back to GitHub
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add definitions.json
        git commit -m "Automated database update from MalwareBazaar" || exit 0
        git push
