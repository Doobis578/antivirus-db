name: Auto Update Virus Definitions

on:
  schedule:
    - cron: '0 * * * *' # This triggers the script automatically every hour
  workflow_dispatch:   # This adds a manual "Run Now" button in the GitHub UI for testing

permissions:
  contents: write      # Gives GitHub permission to save the updated file to your repo

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests

    - name: Execute update script
      run: python fetch_hashes.py

    - name: Commit and Push updates back to GitHub
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add definitions.json
        git commit -m "Automated database update from MalwareBazaar" || exit 0
        git push
